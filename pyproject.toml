[build-system]
requires = ["setuptools>=68", "pybind11==3.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-planning-api"
version = "0.7.0"
description = "Shared contracts for replaceable warehouse planning modules"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.setuptools.package-data]
"warehouse_api.trajectory" = ["*.hpp", "PYBIND11_LICENSE.txt"]
