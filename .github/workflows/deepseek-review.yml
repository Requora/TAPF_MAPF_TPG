name: OpenRouter review
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR number to review
        required: true
        type: number
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: deepseek-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  transport-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Transport regression tests in pinned runtime
        uses: docker://pragent/pr-agent@sha256:80edef71baa3df28c129d858d4b53784abfc14704c235efb32b6c461d5399a6d
        with:
          entrypoint: python
          args: -m unittest discover -s /github/workspace/.github/tests -v

  review:
    needs: transport-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # 中文: review job 使用独立 runner 和固定适配器源码, 不让 PR 测试进程接触模型密钥.
    # English: The review job uses a separate runner and pinned adapter source, keeping PR test processes away from model credentials.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # 中文: 此版本已完成 PR #14/#15 真实审查; 更新适配器时需另行验证并显式更新此 SHA.
          # English: This revision completed real PR #14/#15 reviews; adapter updates require separate verification and an explicit SHA update.
          ref: 9de2738a19eb269f3aaf16f3c302894d7b44e95d
          persist-credentials: false
      - name: PR-Agent review with one observable OpenRouter attempt
        # PR-Agent 0.48.0; retain review logic, replace only model transport.
        uses: docker://pragent/pr-agent@sha256:80edef71baa3df28c129d858d4b53784abfc14704c235efb32b6c461d5399a6d
        with:
          entrypoint: python
          args: /github/workspace/.github/review_transport.py
        env:
          PYTHONPATH: /app
          REVIEW_PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI.API_BASE: https://openrouter.ai/api/v1
          # 中文: openai/ 选择兼容协议; OpenRouter 将请求路由到指定的 DeepSeek 模型.
          # English: openai/ selects the compatible protocol; OpenRouter routes to the named DeepSeek model.
          CONFIG.MODEL: openai/deepseek/deepseek-v4.1-flash-1017
          CONFIG.FALLBACK_MODELS: '[]'
          CONFIG.ADDITIONAL_REASONING_EFFORT_MODELS: '["openai/deepseek/deepseek-v4.1-flash-1017"]'
          CONFIG.REASONING_EFFORT: low
          CONFIG.RESPONSE_LANGUAGE: zh-CN
          # 中文: IGNORE.REGEX 在生成审查 diff 前排除文档, 网页, 参考包及展示资产, 让审查聚焦业务代码和构建配置.
          # English: IGNORE.REGEX excludes docs, websites, reference inputs and presentation assets before diff generation to focus review on application code and build configuration.
          IGNORE.REGEX: '["(?i)^(docs|web|warehouse_api_v0_7)/", "(?i).*\\.(md|markdown|rst|adoc|html?|css|svg|png|jpe?g|gif|webp|pdf)$"]'
          # 中文: 传输层固定 65536 输出 token 和 600 s 总时限; 输入另留 65536 token.
          # English: The adapter enforces 65536 output tokens and a 600-second deadline, with 65536 input tokens reserved.
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: '131072'
          CONFIG.MAX_MODEL_TOKENS: '131072'
          CONFIG.MAX_OUTPUT_TOKENS: '65536'
          CONFIG.AI_TIMEOUT: '600'
          CONFIG.NUM_RETRIES: '0'
          CONFIG.RETRY_SAME_MODEL_ON_TIMEOUT: 'false'
          CONFIG.RETRY_SAME_MODEL_ON_LENGTH: 'false'
          CONFIG.USE_REPO_SETTINGS_FILE: 'false'
          CONFIG.USE_GLOBAL_SETTINGS_FILE: 'false'
          # 中文: 自动 review 不加载 AGENTS.md 等仓库指令, 避免开发流程要求混入代码缺陷审查.
          # English: Automated review loads no repository instruction files so development-process rules do not enter defect review.
          CONFIG.REPO_CONTEXT_FILES: '[]'
          CONFIG.OUTPUT_RUN_DETAILS: 'true'
          CONFIG.LOG_LEVEL: INFO
          CONFIG.ENABLE_AUTO_APPROVAL: 'false'
          CONFIG.RESTRICTED_MODE: 'true'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: 'false'
          GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: 'true'
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/review"]'
          GITHUB_ACTION_CONFIG.FEEDBACK_ON_DRAFT_PR: 'true'
          GITHUB_ACTION_CONFIG.FAIL_ON_TOOL_ERRORS: 'true'
          PR_REVIEWER.INLINE_KEY_ISSUES: 'true'
          PR_REVIEWER.NUM_MAX_FINDINGS: '5'
          PR_REVIEWER.REQUIRE_TICKET_ANALYSIS_REVIEW: 'false'
          PR_REVIEWER.REQUIRE_CAN_BE_SPLIT_REVIEW: 'false'
          PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: 'false'
          PR_REVIEWER.ENABLE_REVIEW_LABELS_EFFORT: 'false'
          PR_REVIEWER.REVIEW_HEADING: DeepSeek 中文代码审查 (OpenRouter)
          PR_REVIEWER.EXTRA_INSTRUCTIONS: >-
            所有审查意见使用简体中文和英文标点. 每条意见说明严重程度,
            具体失败场景和修复建议. 只报告可操作的缺陷, 不重复已修复的问题.
            审查范围仅限业务代码, 测试, 集成适配器及影响代码行为的构建和 CI 配置.
            不审查网页, 文档, 展示样式, 文案翻译, 发布记录或进展统计; 不因这些内容提出意见.
            不检查 PR 行数上限, 拆分要求或其他开发流程规范; 即使 PR 描述提及也不作为审查标准.
            不声称执行过测试. 项目暂不实现模拟器或原生后端.
