name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.14.0
      - run: ruff check src tests .github/review_transport.py .github/tests

  test:
    name: Tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel and check dependencies
        run: |
          python -m pip install dist/*.whl
          python -m pip check
      - name: Test installed wheel in isolated mode
        run: python -I -m unittest discover -s tests -v
      - name: Resolve public contract annotations
        run: |
          python -I - <<'PY'
          from typing import get_type_hints
          from warehouse_api import contracts
          for value in vars(contracts).values():
              if isinstance(value, type) and value.__module__ == contracts.__name__:
                  get_type_hints(value)
                  for method in vars(value).values():
                      if callable(method) and getattr(method, "__annotations__", None):
                          get_type_hints(method)
          print("Contract imports, class and method annotations passed")
          PY

  native:
    name: Real MAWPF and WinkTPG chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install native dependencies from Ubuntu HTTPS mirrors
        # 中文: 原生任务使用官方 HTTPS 源, 避开已观察到下载缓慢的 Azure 源.
        # English: Native jobs use official HTTPS mirrors to avoid the observed slow Azure downloads.
        run: |
          test -f /etc/apt/apt-mirrors.txt
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y cmake libboost-system-dev libboost-program-options-dev libboost-filesystem-dev
      - name: Fetch pinned upstreams
        run: |
          git clone https://github.com/HirokiNagai-39/mawpf.git "$RUNNER_TEMP/mawpf"
          git -C "$RUNNER_TEMP/mawpf" checkout 0cdb8e43797aff3781e4cd3ddb2c6d7d36f3df17
          git clone https://github.com/JingtianYan/WinkTPG-IEEE-TASE.git "$RUNNER_TEMP/winktpg"
          git -C "$RUNNER_TEMP/winktpg" checkout dd96946f225e206de35b041320786eab43210658
      - name: Build adapters and run real chain
        run: |
          cmake -S integrations/native -B "$RUNNER_TEMP/native-build" -DMAWPF_SOURCE_DIR="$RUNNER_TEMP/mawpf" -DWINKTPG_SOURCE_DIR="$RUNNER_TEMP/winktpg"
          cmake --build "$RUNNER_TEMP/native-build" -j 2
          python -m pip install .
          WAREHOUSE_NATIVE_BIN="$RUNNER_TEMP/native-build" python -I -m unittest discover -s tests -v
          PYTHONPATH=tests python -m native.replay "$RUNNER_TEMP/native-build" --output "$RUNNER_TEMP/native-chain.json" --html "$RUNNER_TEMP/native-chain.html"
          PYTHONPATH=tests python -m composition.replay "$RUNNER_TEMP/native-build" --output "$RUNNER_TEMP/composition.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-chain-evidence
          path: |
            ${{ runner.temp }}/native-chain.json
            ${{ runner.temp }}/native-chain.html
            ${{ runner.temp }}/composition.json

  native_tapf:
    name: Real assignment, CBS and CBS-TA comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install native dependencies from Ubuntu HTTPS mirrors
        # 中文: 原生任务使用官方 HTTPS 源, 避开已观察到下载缓慢的 Azure 源.
        # English: Native jobs use official HTTPS mirrors to avoid the observed slow Azure downloads.
        run: |
          test -f /etc/apt/apt-mirrors.txt
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y cmake libboost-program-options-dev libyaml-cpp-dev
      - name: Fetch pinned MIT upstream
        run: |
          git clone https://github.com/whoenig/libMultiRobotPlanning.git "$RUNNER_TEMP/lmrp"
          git -C "$RUNNER_TEMP/lmrp" checkout 4c75fa20c435c440d8b6bd6dc81668ddc7296ba0
      - name: Build and compare real solvers
        run: |
          cmake -S integrations/tapf -B "$RUNNER_TEMP/tapf-build" -DLMRP_SOURCE_DIR="$RUNNER_TEMP/lmrp" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/tapf-build" -j 2
          python -m pip install . PyYAML==6.0.3
          WAREHOUSE_TAPF_BIN="$RUNNER_TEMP/tapf-build" python -I -m unittest discover -s tests -p test_comparison.py -v
          PYTHONPATH=tests python -m tapf.replay "$RUNNER_TEMP/tapf-build" --output "$RUNNER_TEMP/tapf-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tapf-comparison-evidence
          path: ${{ runner.temp }}/tapf-evidence

  required:
    name: CI gate
    if: ${{ always() }}
    needs: [lint, test, native, native_tapf]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          TAPF_RESULT: ${{ needs.native_tapf.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$TAPF_RESULT" = success
