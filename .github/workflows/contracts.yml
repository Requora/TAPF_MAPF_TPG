name: Contracts
on: [push, pull_request]
jobs:
  import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Test installed codec and contract fixtures
        run: python -I -m unittest discover -s tests -v
      - name: Resolve public contract annotations
        run: |
          python - <<'PY'
          from typing import get_type_hints
          from warehouse_api import contracts
          for value in vars(contracts).values():
              if isinstance(value, type) and value.__module__ == contracts.__name__:
                  get_type_hints(value)
                  for method in vars(value).values():
                      if callable(method) and getattr(method, "__annotations__", None):
                          get_type_hints(method)
          print("Contract imports, class and method annotations passed")
          PY
